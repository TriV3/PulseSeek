[package]
name = "pulseseek"
version = "1.0.5"
edition = "2021"
license = "MPL-2.0"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
pulseseek-domain = { path = "../crates/pulseseek-domain" }
pulseseek-browser-fs = { path = "../crates/pulseseek-browser-fs" }
pulseseek-audio-cpal = { path = "../crates/pulseseek-audio-cpal" }
pulseseek-playback = { path = "../crates/pulseseek-playback" }
pulseseek-decoder-symphonia = { path = "../crates/pulseseek-decoder-symphonia" }
pulseseek-cache = { path = "../crates/pulseseek-cache" }
notify-debouncer-full = "0.7.0"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSDragging",
    "NSDraggingItem",
    "NSDraggingSession",
    "NSEvent",
    "NSGraphicsContext",
    "NSImage",
    "NSPasteboard",
    "NSPasteboardItem",
    "NSView",
    "NSWindow",
    "NSWorkspace",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSString",
    "NSURL",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
