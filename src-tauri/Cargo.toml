[package]
name = "pulseseek"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
pulseseek-domain = { path = "../crates/pulseseek-domain" }
pulseseek-browser-fs = { path = "../crates/pulseseek-browser-fs" }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }
